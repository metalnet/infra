apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: remote-pi-relay
  namespace: argocd
spec:
  project: apps
  sources:
  - repoURL: https://github.com/metalnet/infra
    targetRevision: HEAD
    path: kube/apps/remote-pi-relay
  destination:
    server: https://kubernetes.default.svc
    namespace: remote-pi-relay
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
    syncOptions:
      - CreateNamespace=true

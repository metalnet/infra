apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name:  mosquitto
  namespace: argocd
spec:
  project: apps
  sources:
  - repoURL: https://bdclark.github.io/helm-charts
    targetRevision: 0.6.1
    chart: mosquitto
    helm:
      releaseName: mosquitto
      valueFiles:
      - $values/kube/apps/homeassistant/mosquitto/values.yaml
  - repoURL: https://github.com/metalnet/infra.git
    targetRevision: HEAD
    ref: values
  - repoURL: https://github.com/metalnet/infra
    targetRevision: HEAD
    path: kube/apps/homeassistant/mosquitto
  destination:
    server: https://kubernetes.default.svc
    namespace: homeassistant
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
    syncOptions:
      - CreateNamespace=true

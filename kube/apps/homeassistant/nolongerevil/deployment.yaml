apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nolongerevil-data
  namespace: homeassistant
spec:
  accessModes: ["ReadWriteOnce"] 
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nolongerevil
  namespace: homeassistant
  labels:
    app: nolongerevil
spec:
  replicas: 1
  strategy:
    type: Recreate                  
  selector:
    matchLabels:
      app: nolongerevil
  template:
    metadata:
      labels:
        app: nolongerevil
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nolongerevil
          image: ghcr.io/codykociemba/nolongerevil-selfhosted@latest
          ports:
            - name: device-api
              containerPort: 8000
            - name: control-api
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: nolongerevil-config
            - secretRef:
                name: nolongerevil-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          startupProbe:
            httpGet: { path: /health, port: control-api }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: control-api }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: control-api }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nolongerevil-data
---
apiVersion: v1
kind: Service
metadata:
  name: nolongerevil-device
  namespace: homeassistant
spec:
  type: ClusterIP
  selector:
    app: nolongerevil
  ports:
    - name: device-api
      port: 7001
      targetPort: device-api
---
apiVersion: v1
kind: Service
metadata:
  name: nolongerevil-control
  namespace: homeassistant
spec:
  type: ClusterIP
  selector:
    app: nolongerevil
  ports:
    - name: control-api
      port: 8081
      targetPort: control-api

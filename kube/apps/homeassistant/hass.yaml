apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hass
  namespace: argocd
spec:
  project: apps
  sources:
  - repoURL: http://pajikos.github.io/home-assistant-helm-chart
    targetRevision: 0.3.75
    chart: home-assistant
    helm:
      releaseName: hass
      valueFiles:
      - $values/kube/apps/homeassistant/hass/values.yaml
  - repoURL: https://github.com/metalnet/infra.git
    targetRevision: HEAD
    ref: values
  - repoURL: https://github.com/metalnet/infra
    targetRevision: HEAD
    path: kube/apps/homeassistant/hass
  destination:
    server: https://kubernetes.default.svc
    namespace: homeassistant
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
    syncOptions:
      - CreateNamespace=true


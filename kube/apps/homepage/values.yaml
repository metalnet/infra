image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18

enableRbac: true
serviceAccount:
  create: true

config:
  bookmarks: {}
  widgets:
    - search:
        provider: custom
        url: https://www.perplexity.ai/search/?q=
  services:
    - Infrastructure:                                                                     
        - OPNSense:                 
            href: https://opnsense.metalnet.org

  kubernetes:
    mode: cluster
    ingress: false
    traefik: true
    gateway: true

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "www.metalnet.org,metalnet.org,homepage.kube.metalnet.org,homepage"

apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-tls-transport
  namespace: unifi 
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: unifi-webui-service
  namespace: unifi
spec:
  weighted:
    services:
      - name: unifi-unifi-os-server-webui
        port: 443
        weight: 1
        serversTransport: unifi-tls-transport
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: unifi-gateway
  namespace: unifi
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-acme-issuer
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      hostname: "unifi.kube.metalnet.org"
      port: 8443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: unifi-kube-metalnet-org-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-http-route
  namespace: unifi
  annotations:
    gethomepage.dev/href: "https://unifi.kube.metalnet.org"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: UniFi Network Application
    gethomepage.dev/app: unifi-os-server
    uptime-kuma.io/monitor: "true"
spec:
  parentRefs:
    - name: unifi-gateway
      namespace: unifi
      sectionName: websecure
  hostnames:
    - "unifi.kube.metalnet.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: unifi-webui-service
          port: 443
          kind: Service
          group: ""

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: pihole
spec:
  project: apps
  sources:
  - repoURL: ghcr.io/helmforgedev
    targetRevision: 2.0.13
    chart: helm/pihole
    helm:
      releaseName: pihole
      valueFiles:
      - $values/kube/apps/pihole/values.yaml
  - repoURL: https://github.com/metalnet/infra.git
    targetRevision: HEAD
    ref: values
  - repoURL: https://github.com/metalnet/infra
    targetRevision: HEAD
    path: kube/apps/pihole
  destination:
    server: https://kubernetes.default.svc
    namespace: pihole
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
    syncOptions:
      - CreateNamespace=true


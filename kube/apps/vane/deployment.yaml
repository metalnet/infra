apiVersion: apps/v1
kind: Deployment
metadata:
  name: vane
  namespace: vane
  labels:
    app.kubernetes.io/name: vane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vane
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: tzcrazykns1337/vane:latest
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: vane
  namespace: vane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vane
  ports:
    - name: http
      port: 3000
      targetPort: 3000


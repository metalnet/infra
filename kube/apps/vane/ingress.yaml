apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vane-gateway
  namespace: vane
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-acme-issuer
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      hostname: "vane.kube.metalnet.org"
      port: 8443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: vane-kube-metalnet-org-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vane-http-route
  namespace: vane
  annotations:
    gethomepage.dev/href: "https://vane.kube.metalnet.org"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/name: Vane
    gethomepage.dev/app: vane
    uptime-kuma.io/monitor: "true"
spec:
  parentRefs:
    - name: vane-gateway
      namespace: vane
      sectionName: websecure
  hostnames:
    - "vane.kube.metalnet.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vane
          port: 3000
          kind: Service
          group: ""

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kms-tcp-gateway
  namespace: kms
spec:
  gatewayClassName: traefik
  listeners:
    - name: kms
      protocol: TCP
      port: 1688
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: kms-tcp-route
  namespace: kms
spec:
  parentRefs:
    - name: kms-tcp-gateway
      namespace: kms
      sectionName: kms
  rules:
    - backendRefs:
        - name: kms
          port: 1688
          kind: Service
          group: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kms-gateway
  namespace: kms
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-acme-issuer
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      hostname: "kms.kube.metalnet.org"
      port: 8443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: kms-kube-metalnet-org-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kms-http-route
  namespace: kms
  annotations:
    gethomepage.dev/href: "https://kms.kube.metalnet.org"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/name: KMS
    gethomepage.dev/app: kms
    uptime-kuma.io/monitor: "true"
spec:
  parentRefs:
    - name: kms-gateway
      namespace: kms
      sectionName: websecure
  hostnames:
    - "kms.kube.metalnet.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kms-gui
          port: 3000
          kind: Service
          group: ""

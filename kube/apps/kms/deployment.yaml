apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kms-var
  namespace: kms
spec:
  accessModes: ["ReadWriteOnce"]     # one pod mounts it twice
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kms
  namespace: kms
  labels:
    app: kms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kms
  template:
    metadata:
      labels:
        app: kms
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: 11notes/kms:1.0.3
          env:
            - name: TZ
              value: America/Edmonton
          ports:
            - name: kms
              containerPort: 1688
          volumeMounts:
            - name: var
              mountPath: /kms/var
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
        - name: gui
          image: 11notes/kms-gui:1.0.3
          env:
            - name: TZ
              value: America/Edmonton
          ports:
            - name: gui
              containerPort: 3000
          volumeMounts:
            - name: var
              mountPath: /kms/var
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: var
          persistentVolumeClaim:
            claimName: kms-var
---
apiVersion: v1
kind: Service
metadata:
  name: kms
  namespace: kms
spec:
  type: ClusterIP
  selector:
    app: kms
  ports:
    - name: kms
      port: 1688
      targetPort: kms
---
apiVersion: v1
kind: Service
metadata:
  name: kms-gui
  namespace: kms
spec:
  type: ClusterIP
  selector:
    app: kms
  ports:
    - name: gui
      port: 3000
      targetPort: gui

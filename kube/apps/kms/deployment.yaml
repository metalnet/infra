apiVersion: apps/v1
kind: Deployment
metadata:
  name: kms
  namespace: kms
  labels:
    app.kubernetes.io/name: kms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kms
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/py-kms-organization/py-kms:python3
          env:
            - name: TZ
              value: America/Edmonton
          ports:
            - name: kms
              containerPort: 1688
            - name: gui
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: kms
  namespace: kms
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kms
  ports:
    - name: kms
      port: 1688
      targetPort: kms
---
apiVersion: v1
kind: Service
metadata:
  name: kms-gui
  namespace: kms
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kms
  ports:
    - name: gui
      port: 8080
      targetPort: gui

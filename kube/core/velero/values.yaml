configuration:
  features: EnableCSI
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: metalnet-kube
      config:
        s3Url: https://s3.ca-east-006.backblazeb2.com
        region: ca-east-006
        s3ForcePathStyle: true
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: ca-east-006
credentials:
  useSecret: true
  existingSecret: velero-cloud-credentials
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.1@sha256:472d0e486d5d5c23c782b1b123530c7df8645784523ec36ca661a326d47885ff
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
#defaultVolumesToFsBackup: true
snapshotsEnabled: true
deployNodeAgent: true
configuration:
  features: EnableCSI
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: metalnet-kube
      config:
        s3Url: https://s3.ca-east-006.backblazeb2.com
        region: ca-east-006
        s3ForcePathStyle: true
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: ca-east-006
credentials:
  useSecret: true
  existingSecret: velero-cloud-credentials
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.3@sha256:74597d39c143d4d7bc66a27f62a627947715c60ce498b9dfbbd6513f2a113030
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
#defaultVolumesToFsBackup: true
snapshotsEnabled: true
deployNodeAgent: true
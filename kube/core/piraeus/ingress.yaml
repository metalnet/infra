apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: piraeus-gateway
  namespace: piraeus
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-acme-issuer
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      hostname: "piraeus.kube.metalnet.org"
      port: 8443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: piraeus-kube-metalnet-org-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: piraeus-http-route
  namespace: piraeus
  annotations:
    gethomepage.dev/href: "https://piraeus.kube.metalnet.org"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Piraeus
    gethomepage.dev/app: piraeus-datastore
    uptime-kuma.io/monitor: "true"
spec:
  parentRefs:
    - name: piraeus-gateway
      namespace: piraeus
      sectionName: websecure
  hostnames:
    - "piraeus.kube.metalnet.org"
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ui/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: linstor-controller
          port: 3370
          kind: Service
          group: ""

deployment:
  kind: DaemonSet
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: ""
ingressClass:
  enabled: false
experimental:
  kubernetesGateway:
    enabled: true
api:
  insecure: true
providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    allowExternalNameServices: true
  kubernetesGateway:
    enabled: true
    experimentalChannel: true
gateway:
  enabled: false
ports:
  metrics:
    expose:
      default: true
  kms:
    port: 1688
    exposedPort: 1688
    protocol: TCP
    expose:
      default: true
  mqtt:
    port: 1883
    exposedPort: 1883
    protocol: TCP
    expose:
      default: true
  mqtts:
    port: 8883
    exposedPort: 8883
    protocol: TCP
    expose:
      default: true
  syslog-tcp:
    port: 1514
    exposedPort: 1514
    protocol: TCP
    expose:
      default: true
service:
  annotations:
    metallb.io/loadBalancerIPs: 192.168.10.70
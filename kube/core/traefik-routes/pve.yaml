apiVersion: v1
kind: Service
metadata:
  name: pve-service
  namespace: traefik
spec:
  type: ExternalName
  externalName: pve.metalnet.org
  ports:
    - name: https
      port: 8006
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: proxmox-tls-cert
  namespace: traefik
spec:
  secretName: proxmox-kube-metalnet-org-tls
  issuerRef:
    name: cloudflare-acme-issuer
    kind: ClusterIssuer
  dnsNames:
    - proxmox.kube.metalnet.org
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox-route
  namespace: traefik
  annotations:
    gethomepage.dev/href: "https://proxmox.kube.metalnet.org"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Proxmox Virtual Environment
    gethomepage.dev/app: pve-service
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`proxmox.kube.metalnet.org`)
      kind: Rule
      services:
        - name: pve-service
          port: 8006
  tls:
    secretName: proxmox-kube-metalnet-org-tls


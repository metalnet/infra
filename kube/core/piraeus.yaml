apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: piraeus
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: ghcr.io/piraeusdatastore
    targetRevision: 2.11.0
    chart: piraeus-operator/piraeus
    helm:
      releaseName: piraeus
      valueFiles:
      - $values/kube/core/piraeus/values.yaml
  - repoURL: ghcr.io/piraeusdatastore
    targetRevision: 1.2.0
    chart: helm-charts/linstor-cluster
    helm:
      releaseName: linstor-cluster
      valuesObject:
        monitoring:
          enabled: true
  - repoURL: https://github.com/metalnet/infra.git
    targetRevision: HEAD
    ref: values
  - repoURL: https://github.com/metalnet/infra
    targetRevision: HEAD
    path: kube/core/piraeus
  destination:
    server: https://kubernetes.default.svc
    namespace: piraeus
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged


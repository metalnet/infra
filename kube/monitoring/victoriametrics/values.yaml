nameOverride: vmks
defaultDashboards:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
    
victoria-metrics-operator:
  operator:
    prometheus_converter_add_argocd_ignore_annotations: true
  enable_converter_ownership: false
    
vmsingle:
  server:
    persistentVolume:
      extraLabels:
        velero.io/exclude-from-backup: true
        
vmagent:
  spec:
    extraEnvs:
      - name: GOGC
        value: "100"

vmalert:
  spec:
    extraArgs:
      external.alert.source: 'https://grafana.kube.metalnet.org/explore?left={"datasource":"VictoriaMetrics","queries":[{"expr":{{`"{{ .Expr|jsonEscape|queryEscape }}"`}},"refId":"A"}],"range":{"from":{{`"{{ .ActiveAt.UnixMilli }}"`}},"to":"now"}}'

vlsingle:
  enabled: true
  server:
    persistentVolume:
      extraLabels:
        velero.io/exclude-from-backup: true
  spec:
    retentionPeriod: 30d
    storage:
      resources:
        requests:
          storage: 30Gi
          
vlagent:
  enabled: true
  spec:
    k8sCollector:
      enabled: true
    syslogSpec:
      tcpListeners:
        - listenPort: 1514
    serviceSpec:
      spec:
        metadata:
          annotations:
            metallb.io/loadBalancerIPs: 192.168.10.73
        type: LoadBalancer
        ports: 
          - name: syslog-tcp
            port: 1514
            protocol: TCP
            targetPort: 1514
      
grafana:
  useStatefulSet: true
  persistence:
    enabled: true
    volumeName: pvc-983c4a66-c6d4-4c24-aeb3-1f2c31b3432e
    size: 10Gi
  extraVolumeMounts:
    - name: grafana-plugins-volume
      mountPath: /var/lib/grafana/plugins
      readOnly: false
  extraVolumes:
  - name: grafana-plugins-volume
    existingClaim: grafana-plugins-pvc
  plugins:
    - victoriametrics-logs-datasource
  grafana.ini:
    server:
      root_url: https://grafana.kube.metalnet.org/

alertmanager:
  spec:
    configSecret: alertmanager-discord-config

kubeControllerManager:
  vmScrape:
    spec:
      jobLabel: app.kubernetes.io/component
      namespaceSelector:
        matchNames: []
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
            insecureSkipVerify: true

kubeScheduler:
  vmScrape:
    spec:
      jobLabel: app.kubernetes.io/component
      namespaceSelector:
        matchNames: []
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecureSkipVerify: true
